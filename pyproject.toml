[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-anomaly-lab"
version = "0.1.0"
description = "Graph-based anomaly detection experiments on Elliptic++"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "networkx",
    "matplotlib",
    "seaborn",
    "node2vec",
]

[tool.setuptools.packages.find]
where = ["src"]