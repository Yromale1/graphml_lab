name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint graphlab
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install Ruff
      working-directory: src/graphlab
      run: ruff check . > pylint_report.txt || true

    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: lint_report
        path: src/graphlab/pylint_report.txt
    
  display-lint:
    name: Display lint report
    runs-on: ubuntu-latest
    needs:
    - lint

    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: lint_report
          path: src/graphlab

      - name: Display report
        run: |
          echo "Ruff report:"
          cat src/graphlab/pylint_report.txt